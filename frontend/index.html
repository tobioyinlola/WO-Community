<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>WO Community</title>
    <script>
      // Set the theme before first paint so there is no flash: a saved choice, else the OS.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("wo-theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
