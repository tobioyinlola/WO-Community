name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wo
          POSTGRES_PASSWORD: wo
          POSTGRES_DB: wo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the migration lint compares with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          black --check .
      - name: Types
        run: mypy apps config
      - name: Security
        run: |
          bandit -q -c pyproject.toml -r apps config
          pip-audit
      - name: Module boundaries
        run: lint-imports
      - name: Migration safety (new migrations only)
        run: make lint-migrations BASE=origin/${{ github.base_ref || 'main' }}
      - name: Tests
        run: pytest -q
      - name: Toolkit evaluation set
        run: python manage.py toolkit_evaluate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: API description is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -q <(tr -d '\r' < /tmp/openapi.yaml) <(tr -d '\r' < docs/api/openapi.yaml)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Deployment settings
        run: python scripts/deploy_check.py

  web:
    name: Web front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wo-community-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configuration loads inside the image
        run: docker run --rm wo-community-backend:${{ github.sha }} python scripts/deploy_check.py
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: wo-community-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
