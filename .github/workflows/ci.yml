name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wo
          POSTGRES_PASSWORD: wo
          POSTGRES_DB: wo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the migration lint compares with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          black --check .
      - name: Types
        run: mypy apps config
      - name: Security
        run: |
          bandit -q -c pyproject.toml -r apps config
          pip-audit
      - name: Module boundaries
        run: lint-imports
      - name: Migration safety (new migrations only)
        run: make lint-migrations BASE=origin/${{ github.base_ref || 'main' }}
      - name: Tests
        run: pytest -q
      - name: Toolkit evaluation set
        run: python manage.py toolkit_evaluate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: API description is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -q <(tr -d '\r' < /tmp/openapi.yaml) <(tr -d '\r' < docs/api/openapi.yaml)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Deployment settings
        run: python scripts/deploy_check.py

  web:
    name: Web front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        env:
          # The build refuses to run without the API address; this one only has to look right.
          VITE_API_URL: https://api.example.com
        run: npm run build

  e2e:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: screens and flows
            specs: e2e/public-and-auth.spec.ts e2e/member.spec.ts e2e/launch.spec.ts e2e/admin.spec.ts
          - name: widths and accessibility
            specs: e2e/accessibility.spec.ts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wo
          POSTGRES_PASSWORD: wo
          POSTGRES_DB: wo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wo" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Install the web app and a browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare the demo community
        run: |
          python manage.py migrate
          python scripts/seed_demo.py
          python scripts/seed_admin_demo.py
      - name: Start the API and the worker
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          nohup celery -A config worker -l info -c 2 -Q critical,default,email,media,exports,analytics,ai > "$GITHUB_WORKSPACE/worker.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl -fs http://127.0.0.1:8000/health/live && exit 0
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/api.log"
          exit 1
      - name: Run the browser tests
        working-directory: frontend
        run: npx playwright test ${{ matrix.specs }}
      - name: Show what the API refused
        if: failure()
        run: |
          # Written as annotations so the reason is readable without downloading the log.
          grep -E '" (400|401|403|409|412|428|429|500) ' api.log | tail -40 | while IFS= read -r line; do
            echo "::warning title=API::${line:0:300}"
          done
          grep -iE 'traceback|error' worker.log | tail -10 | while IFS= read -r line; do
            echo "::warning title=Worker::${line:0:300}"
          done
      - name: Keep the evidence when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence-${{ strategy.job-index }}
          path: |
            frontend/test-results
            api.log
            worker.log
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wo-community-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configuration loads inside the image
        run: docker run --rm wo-community-backend:${{ github.sha }} python scripts/deploy_check.py
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: wo-community-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
