  /api/v1/auth/google:
    post:
      operationId: auth_google_create
      description: Send the ID token the browser got from Google. A member who already
        has this address (or this Google login) is signed in exactly as with a password,
        including the MFA step. A new person gets 409 `registration_required` until
        the request also carries `registration` (consents and sign-up details); the
        account is then created pending admin approval, or approved at once with a
        valid `invitation_token` for the same address, and the answer is 201.
      summary: Sign in or sign up with Google
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
          description: ''
        '401':
          description: Invalid Google token or account unusable
        '403':
          description: Google address not verified
        '404':
          description: Google sign-in is not configured
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleRegistrationRequired'
          description: ''
