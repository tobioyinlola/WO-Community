      description: 'Post the form''s `form_data`, then the file as the last field
        named `file`, to the form''s `url`. The file goes straight to storage, never
        through this API. Then call `POST /uploads/{id}/complete`. Allowed: JPEG,
        PNG or WebP up to 5 MB.'
      summary: Reserve an upload and get the form to send the file with
      tags:
      - uploads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCreated'
          description: ''
        '400':
          description: Invalid purpose, type or size
        '401':
          description: Not authenticated
        '404':
          description: No such upload
        '409':
          description: The file has not arrived, or the upload window closed
        '429':
          description: Too many uploads
  /api/v1/uploads/{upload_id}:
    get:
      operationId: uploads_retrieve
      summary: Status of one of your uploads
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - uploads
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '400':
          description: Invalid purpose, type or size
        '401':
          description: Not authenticated
        '404':
          description: No such upload
        '409':
          description: The file has not arrived, or the upload window closed
        '429':
          description: Too many uploads
  /api/v1/uploads/{upload_id}/complete:
    post:
      operationId: uploads_complete_create
      description: Starts the checks. Poll `GET /uploads/{id}` until the status is
        `ready` or `rejected`. Calling it again is harmless.
      summary: Tell the server the file has been uploaded
      parameters:
      - in: path
        name: upload_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - uploads
      security:
      - bearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
          description: ''
        '400':
          description: Invalid purpose, type or size
        '401':
          description: Not authenticated
        '404':
          description: No such upload
        '409':
          description: The file has not arrived, or the upload window closed
        '429':
          description: Too many uploads
  /api/v1/webhooks/email/{provider}:
    post:
      operationId: webhooks_email_create
      description: Called by the email provider. The signature headers are required.
      summary: Receive an email delivery report
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - webhooks
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
          description: ''
        '401':
          description: Signature missing or wrong
        '404':
          description: Not the configured provider
  /health/live:
    get:
      operationId: health_live_retrieve
      summary: Liveness probe
      tags:
