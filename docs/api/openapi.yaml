  /api/v1/admin/reference/{kind}:
    get:
      operationId: admin_reference_list
      summary: Every entry of a list, retired ones included, with how many records
        use it
      parameters:
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReferenceItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Unknown list or entry
        '409':
          description: Name or slug taken, entry in use, or the list changed
    post:
      operationId: admin_reference_create
      description: The slug defaults to one made from the name and can never be changed.
      summary: Add an entry
      parameters:
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
