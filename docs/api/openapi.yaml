openapi: 3.0.3
info:
  title: WO Community API
  version: 1.0.0
  description: REST API for the WO Community platform.
paths:
  /api/v1/admin/invitations:
    get:
      operationId: admin_invitations_list
      summary: List invitations
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - sent
          - opened
          - registered
          - revoked
          - expired
          type: string
          default: ''
          minLength: 1
        description: |-
          * `sent` - sent
          * `opened` - opened
          * `registered` - registered
          * `revoked` - revoked
          * `expired` - expired
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
    post:
      operationId: admin_invitations_create
      description: Registering through the emailed link approves the member automatically.
      summary: Invite one person by email
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
  /api/v1/admin/invitations/{invitation_id}:
    get:
      operationId: admin_invitations_retrieve
      summary: One invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
  /api/v1/admin/invitations/{invitation_id}/resend:
    post:
      operationId: admin_invitations_resend_create
      description: Issues a new link and expiry; the previous link stops working.
      summary: Resend an invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
  /api/v1/admin/invitations/{invitation_id}/revoke:
    post:
      operationId: admin_invitations_revoke_create
      summary: Revoke an invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
  /api/v1/admin/invitations/bulk:
    post:
      operationId: admin_invitations_bulk_create
      description: 'Send the file''s contents as `csv`. The first row must name the
        columns: `email` (required), `role` and `message` (optional). Up to 500 rows.
        Rows that fail are reported and skipped; the rest are invited.'
      summary: Invite many people from CSV text
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkInvitationRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReport'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
  /api/v1/admin/members:
    get:
      operationId: admin_members_list
      summary: Search and filter members
      parameters:
      - in: query
        name: email_verified
        schema:
          type: boolean
          nullable: true
      - in: query
        name: joined_after
        schema:
          type: string
          format: date
      - in: query
        name: joined_before
        schema:
          type: string
          format: date
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: role
        schema:
          type: string
          minLength: 1
          default: ''
          maxLength: 30
      - in: query
        name: status
        schema:
          enum:
          - pending
          - active
          - suspended
          - removed
          - rejected
          type: string
          default: ''
          minLength: 1
        description: |-
          * `pending` - pending
          * `active` - active
          * `suspended` - suspended
          * `removed` - removed
          * `rejected` - rejected
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}:
    get:
      operationId: admin_members_retrieve
      summary: One member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/approve:
    post:
      operationId: admin_members_approve_create
      summary: Approve a pending registration
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/reinstate:
    post:
      operationId: admin_members_reinstate_create
      summary: Reinstate a suspended member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/reject:
    post:
      operationId: admin_members_reject_create
      description: The reason is emailed to the applicant.
      summary: Reject a pending registration
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/remove:
    post:
      operationId: admin_members_remove_create
      description: Ends all their sessions and takes their public pages down.
      summary: Remove a member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/reset-mfa:
    post:
      operationId: admin_members_reset_mfa_create
      description: Super admin only. Ends the admin's sessions; they enrol again at
        next login.
      summary: Reset an admin's MFA after they lost their authenticator
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/suspend:
    post:
      operationId: admin_members_suspend_create
      description: Ends all their sessions immediately.
      summary: Suspend a member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/queues:
    get:
      operationId: admin_queues_retrieve
      summary: Counts of items waiting for an admin
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCounts'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/reference/{kind}:
    get:
      operationId: admin_reference_list
      summary: Every entry of a list, retired ones included, with how many records
        use it
      parameters:
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReferenceItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Unknown list or entry
        '409':
          description: Name or slug taken, entry in use, or the list changed
    post:
      operationId: admin_reference_create
      description: The slug defaults to one made from the name and can never be changed.
      summary: Add an entry
      parameters:
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Unknown list or entry
        '409':
          description: Name or slug taken, entry in use, or the list changed
  /api/v1/admin/reference/{kind}/{item_id}:
    patch:
      operationId: admin_reference_partial_update
      description: Retiring hides an entry from new choices; records that already
        use it keep it. Renaming updates the public pages that show it.
      summary: Rename, retire, restore or reposition an entry
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReferenceUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Unknown list or entry
        '409':
          description: Name or slug taken, entry in use, or the list changed
    delete:
      operationId: admin_reference_destroy
      description: An entry in use cannot be deleted (409); retire it instead.
      summary: Delete an entry nobody uses
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}$
        required: true
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Unknown list or entry
        '409':
          description: Name or slug taken, entry in use, or the list changed
  /api/v1/admin/reference/{kind}/order:
    put:
      operationId: admin_reference_order_update
      description: Send every entry's id exactly once, in the order wanted.
      summary: Set the display order of a list
      parameters:
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - sectors
          - skills
          - stages
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferenceOrderRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReferenceItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Unknown list or entry
        '409':
          description: Name or slug taken, entry in use, or the list changed
  /api/v1/admin/startups/{startup_id}/feature:
    post:
      operationId: admin_startups_feature_create
      summary: Pin a listed startup to the top of the directory
      parameters:
      - in: path
        name: startup_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Featured'
          description: ''
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such startup
        '409':
          description: Only listed startups can be featured
  /api/v1/admin/startups/{startup_id}/unfeature:
    post:
      operationId: admin_startups_unfeature_create
      summary: Remove a startup's pin
      parameters:
      - in: path
        name: startup_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Featured'
          description: ''
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such startup
        '409':
          description: Only listed startups can be featured
  /api/v1/auth/invitations/inspect:
    post:
      operationId: auth_invitations_inspect_create
      description: Lets the registration page prefill the invited address. Marks the
        invitation as opened.
      summary: Look up an invitation link
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '400':
          description: Invalid
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Returns a short lived access token and sets the refresh token cookie.
        Accounts with MFA get a 202 with an `mfa_token` instead; finish with `POST
        /auth/mfa/verify`.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
          description: ''
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified
        '429':
          description: Too many attempts
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Unauthenticated endpoint with its own rate limit scope.
      summary: Log out of this session
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/confirm:
    post:
      operationId: auth_mfa_confirm_create
      description: Proves the authenticator works. Returns an access token that already
        counts as MFA-verified, and the recovery codes, which are shown only this
        once.
      summary: Confirm MFA enrolment
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaConfirmed'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/enrol:
    post:
      operationId: auth_mfa_enrol_create
      description: Returns the secret and an otpauth URI to show as a QR code. Calling
        it again before confirming replaces the pending secret.
      summary: Start MFA enrolment
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrolment'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/recovery-codes:
    post:
      operationId: auth_mfa_recovery_codes_create
      description: Needs a current authenticator code. The old codes stop working.
      summary: Replace recovery codes
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/step-up:
    post:
      operationId: auth_mfa_step_up_create
      description: Returns a new access token whose MFA check is fresh.
      summary: Re-check MFA for a destructive action
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/verify:
    post:
      operationId: auth_mfa_verify_create
      description: Takes the `mfa_token` from the login response and a code from the
        authenticator app or an unused recovery code. Sets the refresh cookie.
      summary: Finish logging in with an MFA code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
