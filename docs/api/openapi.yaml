              $ref: '#/components/schemas/WinCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Win'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not an active member
        '404':
          description: Not found, or not published
        '429':
          description: Daily limit
