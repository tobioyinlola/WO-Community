  /api/v1/admin/invitations:
    get:
      operationId: admin_invitations_list
      summary: List invitations
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - sent
          - opened
          - registered
          - revoked
          - expired
          type: string
          default: ''
          minLength: 1
        description: |-
          * `sent` - sent
          * `opened` - opened
          * `registered` - registered
          * `revoked` - revoked
          * `expired` - expired
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
    post:
      operationId: admin_invitations_create
      description: Registering through the emailed link approves the member automatically.
      summary: Invite one person by email
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Invitation not found
        '409':
          description: Already registered, already invited, or not in a state that
            allows this
