          * `mentee` - mentee
      - in: query
        name: state
        schema:
          enum:
          - upcoming
          - pending
          - past
          - closed
          - all
          type: string
          default: upcoming
          minLength: 1
        description: |-
          `upcoming` confirmed and not yet over, `pending` waiting for an answer, `past` held or missed, `closed` declined, cancelled or lapsed.

          * `upcoming` - upcoming
          * `pending` - pending
          * `past` - past
          * `closed` - closed
          * `all` - all
