        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WinPage'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not an active member
        '404':
          description: Not found, or not published
    post:
      operationId: win_submissions_create
      description: An award, funding round or partnership, with a link to evidence.
        Up to 3 waiting at once and 5 a day. You are told when it is reviewed.
      summary: Submit a win for the team to review
      tags:
