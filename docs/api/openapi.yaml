      summary: Search and filter members
      parameters:
      - in: query
        name: email_verified
        schema:
          type: boolean
          nullable: true
      - in: query
        name: joined_after
        schema:
          type: string
          format: date
      - in: query
        name: joined_before
        schema:
          type: string
          format: date
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: role
        schema:
          type: string
          minLength: 1
          default: ''
          maxLength: 30
      - in: query
        name: status
        schema:
          enum:
          - pending
          - active
          - suspended
          - removed
          - rejected
          type: string
          default: ''
          minLength: 1
        description: |-
          * `pending` - pending
          * `active` - active
          * `suspended` - suspended
          * `removed` - removed
          * `rejected` - rejected
