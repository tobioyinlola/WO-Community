          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/editorial/{item_id}/publish:
    post:
      operationId: admin_editorial_publish_create
      description: Publish now, or take down / cancel a schedule (the URL names the
        action).
      summary: Publish an item now, or take it down
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not in a state that allows this
  /api/v1/admin/editorial/{item_id}/schedule:
    post:
      operationId: admin_editorial_schedule_create
      description: '`publish_at` must be in the future. A worker publishes it within
        a minute of that time, stamped with the scheduled time.'
      summary: Schedule an item to publish itself
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Published
  /api/v1/admin/editorial/{item_id}/unpublish:
    post:
      operationId: admin_editorial_unpublish_create
      description: Publish now, or take down / cancel a schedule (the URL names the
        action).
      summary: Publish an item now, or take it down
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not in a state that allows this
  /api/v1/admin/events:
    get:
      operationId: admin_events_list
      summary: All events, any state
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - published
          - cancelled
          type: string
          default: ''
          minLength: 1
        description: |-
          * `draft` - draft
          * `published` - published
          * `cancelled` - cancelled
      - in: query
        name: type
        schema:
          enum:
          - demo_day
          - workshop
          - meetup
          - announcement
          type: string
          default: ''
          minLength: 1
        description: |-
          * `demo_day` - demo_day
          * `workshop` - workshop
          * `meetup` - meetup
          * `announcement` - announcement
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    post:
      operationId: admin_events_create
      description: Starts as a draft. Times are sent with an offset and stored in
        UTC; `timezone` is the place's zone name (default UTC). `capacity` blank means
        unlimited.
      summary: Create an event
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/events/{event_id}:
    get:
      operationId: admin_events_retrieve
      summary: One event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    patch:
      operationId: admin_events_partial_update
      description: Changing the times of a published event tells everyone registered
        and resets their reminders. Capacity cannot drop below the number registered.
        After the event, add `recording_url` and `summary` for the archive.
      summary: Edit an event
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        required: true
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Cancelled
        '412':
          description: Changed since the ETag was issued
        '428':
          description: If-Match header missing
    delete:
      operationId: admin_events_destroy
      summary: Remove an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/events/{event_id}/attendees:
    get:
      operationId: admin_events_attendees_list
      description: Names and email addresses, so it needs a recent MFA check. Reading
        is logged.
      summary: Who registered
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendee'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/events/{event_id}/attendees.csv:
    get:
      operationId: admin_events_attendees.csv_retrieve
      summary: Export the attendee list as CSV
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: CSV file
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/events/{event_id}/attendees/{user_id}/check-in:
    post:
      operationId: admin_events_attendees_check_in_create
      summary: Mark an attendee as present (or not)
      parameters:
