openapi: 3.0.3
info:
  title: WO Community API
  version: 1.0.0
  description: REST API for the WO Community platform.
paths:
  /api/v1/admin/comments/{comment_id}/hide:
    post:
      operationId: admin_comments_hide_create
      description: 'Actions: hide, unhide, remove (removing takes its replies too).
        The post''s comment count follows. Every action is written to the audit log.'
      summary: Moderate a comment
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResult'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such post
  /api/v1/admin/comments/{comment_id}/remove:
    post:
      operationId: admin_comments_remove_create
      description: 'Actions: hide, unhide, remove (removing takes its replies too).
        The post''s comment count follows. Every action is written to the audit log.'
      summary: Moderate a comment
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResult'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such post
  /api/v1/admin/comments/{comment_id}/unhide:
    post:
      operationId: admin_comments_unhide_create
      description: 'Actions: hide, unhide, remove (removing takes its replies too).
        The post''s comment count follows. Every action is written to the audit log.'
      summary: Moderate a comment
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResult'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such post
  /api/v1/admin/editorial:
    get:
      operationId: admin_editorial_list
      description: Newest first. Filter by `status` (draft, scheduled, published),
        `type`, text.
      summary: Editorial items, any state
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - scheduled
          - published
          type: string
          default: ''
          minLength: 1
        description: |-
          * `draft` - draft
          * `scheduled` - scheduled
          * `published` - published
      - in: query
        name: type
        schema:
          enum:
          - award
          - celebration
          - partnership
          - funding
          - news
          - announcement
          type: string
          default: ''
          minLength: 1
        description: |-
          * `award` - award
          * `celebration` - celebration
          * `partnership` - partnership
          * `funding` - funding
          * `news` - news
          * `announcement` - announcement
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    post:
      operationId: admin_editorial_create
      description: Starts as a draft. Publish it now, or schedule it. Only announcements
        can have a banner window (at most 90 days). `public` lets the public website
        show it.
      summary: Write a news item, award, celebration, partnership, funding story or
        announcement
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/editorial-comments/{comment_id}/hide:
    post:
      operationId: admin_editorial_comments_hide_create
      description: Hide, unhide or remove a comment on an item (the URL names the
        action).
      summary: Moderate a comment on an item
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCommentModerationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCommentModeration'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/editorial-comments/{comment_id}/remove:
    post:
      operationId: admin_editorial_comments_remove_create
      description: Hide, unhide or remove a comment on an item (the URL names the
        action).
      summary: Moderate a comment on an item
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCommentModerationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCommentModeration'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/editorial-comments/{comment_id}/unhide:
    post:
      operationId: admin_editorial_comments_unhide_create
      description: Hide, unhide or remove a comment on an item (the URL names the
        action).
      summary: Moderate a comment on an item
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCommentModerationRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCommentModeration'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/editorial/{item_id}:
    get:
      operationId: admin_editorial_retrieve
      summary: One item
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    patch:
      operationId: admin_editorial_partial_update
      summary: Edit an item
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '412':
          description: Changed since the ETag was issued
        '428':
          description: If-Match header missing
    delete:
      operationId: admin_editorial_destroy
      summary: Remove an item
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/editorial/{item_id}/cover:
    put:
      operationId: admin_editorial_cover_update
      description: Upload with `POST /uploads` (purpose `editorial_cover`) and wait
        for `ready`.
      summary: Use a finished upload as the cover
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
