      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/events/{event_id}/cancel:
    post:
      operationId: admin_events_cancel_create
      description: Publish needs a start in the future. Unpublish only while nobody
        has registered. Cancel tells everyone registered and closes registration.
      summary: Publish, unpublish or cancel an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventReasonRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not in a state that allows this
  /api/v1/admin/events/{event_id}/publish:
    post:
      operationId: admin_events_publish_create
      description: Publish needs a start in the future. Unpublish only while nobody
        has registered. Cancel tells everyone registered and closes registration.
      summary: Publish, unpublish or cancel an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventReasonRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not in a state that allows this
  /api/v1/admin/events/{event_id}/slots:
    put:
      operationId: admin_events_slots_update
      description: Replaces the whole list; the order sent is the pitch order. Demo
        days only.
      summary: Set the demo day's presenting startups and pitch order
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotsRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not a demo day
  /api/v1/admin/events/{event_id}/unpublish:
    post:
      operationId: admin_events_unpublish_create
      description: Publish needs a start in the future. Unpublish only while nobody
        has registered. Cancel tells everyone registered and closes registration.
      summary: Publish, unpublish or cancel an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventReasonRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEvent'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not in a state that allows this
  /api/v1/admin/invitations:
    get:
      operationId: admin_invitations_list
      summary: List invitations
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
