            application/json:
              schema:
                $ref: '#/components/schemas/AdminItem'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    delete:
      operationId: admin_editorial_cover_destroy
      summary: Remove the cover
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
