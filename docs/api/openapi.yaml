    get:
      operationId: admin_courses_list
      summary: All courses, any state
      parameters:
      - in: query
        name: access
        schema:
          enum:
          - free
          - paid
          type: string
          default: ''
          minLength: 1
        description: |-
          * `free` - free
          * `paid` - paid
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - published
          type: string
          default: ''
          minLength: 1
        description: |-
          * `draft` - draft
          * `published` - published
      tags:
