openapi: 3.0.3
info:
  title: WO Community API
  version: 1.0.0
  description: REST API for the WO Community platform.
paths:
  /api/v1/admin/members:
    get:
      operationId: admin_members_list
      summary: Search and filter members
      parameters:
      - in: query
        name: email_verified
        schema:
          type: boolean
          nullable: true
      - in: query
        name: joined_after
        schema:
          type: string
          format: date
      - in: query
        name: joined_before
        schema:
          type: string
          format: date
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: role
        schema:
          type: string
          minLength: 1
          default: ''
          maxLength: 30
      - in: query
        name: status
        schema:
          enum:
          - pending
          - active
          - suspended
          - removed
          - rejected
          type: string
          default: ''
          minLength: 1
        description: |-
          * `pending` - pending
          * `active` - active
          * `suspended` - suspended
          * `removed` - removed
          * `rejected` - rejected
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}:
    get:
      operationId: admin_members_retrieve
      summary: One member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/approve:
    post:
      operationId: admin_members_approve_create
      summary: Approve a pending registration
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/reinstate:
    post:
      operationId: admin_members_reinstate_create
      summary: Reinstate a suspended member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/reject:
    post:
      operationId: admin_members_reject_create
      description: The reason is emailed to the applicant.
      summary: Reject a pending registration
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/remove:
    post:
      operationId: admin_members_remove_create
      description: Ends all their sessions and takes their public pages down.
      summary: Remove a member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/reset-mfa:
    post:
      operationId: admin_members_reset_mfa_create
      description: Super admin only. Ends the admin's sessions; they enrol again at
        next login.
      summary: Reset an admin's MFA after they lost their authenticator
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/members/{user_id}/suspend:
    post:
      operationId: admin_members_suspend_create
      description: Ends all their sessions immediately.
      summary: Suspend a member
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/admin/queues:
    get:
      operationId: admin_queues_retrieve
      summary: Counts of items waiting for an admin
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueCounts'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, MFA missing, or step-up required
        '404':
          description: Member not found
        '409':
          description: The account is not in a state that allows this
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Returns a short lived access token and sets the refresh token cookie.
        Accounts with MFA get a 202 with an `mfa_token` instead; finish with `POST
        /auth/mfa/verify`.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallenge'
          description: ''
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified
        '429':
          description: Too many attempts
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Unauthenticated endpoint with its own rate limit scope.
      summary: Log out of this session
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/mfa/confirm:
    post:
      operationId: auth_mfa_confirm_create
      description: Proves the authenticator works. Returns an access token that already
        counts as MFA-verified, and the recovery codes, which are shown only this
        once.
      summary: Confirm MFA enrolment
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaConfirmed'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/enrol:
    post:
      operationId: auth_mfa_enrol_create
      description: Returns the secret and an otpauth URI to show as a QR code. Calling
        it again before confirming replaces the pending secret.
      summary: Start MFA enrolment
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrolment'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/recovery-codes:
    post:
      operationId: auth_mfa_recovery_codes_create
      description: Needs a current authenticator code. The old codes stop working.
      summary: Replace recovery codes
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/step-up:
    post:
      operationId: auth_mfa_step_up_create
      description: Returns a new access token whose MFA check is fresh.
      summary: Re-check MFA for a destructive action
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/mfa/verify:
    post:
      operationId: auth_mfa_verify_create
      description: Takes the `mfa_token` from the login response and a code from the
        authenticator app or an unused recovery code. Sets the refresh cookie.
      summary: Finish logging in with an MFA code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: Invalid code
        '401':
          description: Not authenticated or sign-in step expired
        '403':
          description: Not an admin account
        '409':
          description: MFA is already set up
        '429':
          description: Too many wrong codes
  /api/v1/auth/password/forgot:
    post:
      operationId: auth_password_forgot_create
      description: Always answers 202 so it cannot be used to find registered addresses.
      summary: Ask for a password reset email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: Revokes every session of the account.
      summary: Choose a new password with a reset token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid input
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Reads the refresh cookie and requires an X-Requested-With header.
        Reusing an old refresh token revokes the whole session.
      summary: Rotate the refresh token and get a new access token
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          description: Invalid
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: Always answers 202, whether or not the address is already registered.
        The account stays pending until an admin approves it.
      summary: Register an account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/verify-email:
    post:
      operationId: auth_verify_email_create
      description: Unauthenticated endpoint with its own rate limit scope.
      summary: Confirm an email address
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '400':
          description: Invalid token
  /api/v1/me:
    get:
      operationId: me_retrieve
      summary: Current account
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/me/sessions:
    get:
      operationId: me_sessions_list
      summary: List your active sessions
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: me_sessions_destroy
      summary: Revoke one of your sessions
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: Not found
  /api/v1/ping:
    get:
      operationId: ping_retrieve
      summary: API availability check
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
          description: ''
  /health/live:
    get:
      operationId: health_live_retrieve
      summary: Liveness probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
  /health/ready:
    get:
      operationId: health_ready_retrieve
      summary: 'Readiness probe: database and cache reachable'
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/Account'
        mfa_enrolment_required:
          type: boolean
      required:
      - access_token
      - expires_in
      - mfa_enrolment_required
      - token_type
      - user
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
      required:
      - email
      - id
      - status
    CodeRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
    ForgotPasswordRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    LoginRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - email
      - id
      - roles
      - status
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
        roles:
          type: array
          items:
            type: string
          readOnly: true
        email_verified_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
        approval_source:
          type: string
        status_reason:
          type: string
        status_changed_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - approval_source
      - approved_at
      - created_at
      - email
      - email_verified_at
      - id
      - last_login
      - roles
      - status
      - status_changed_at
      - status_reason
    Message:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    MfaChallenge:
      type: object
      properties:
        mfa_required:
          type: boolean
        mfa_token:
          type: string
      required:
      - mfa_required
      - mfa_token
    MfaConfirmed:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - access_token
      - expires_in
      - recovery_codes
      - token_type
    MfaEnrolment:
      type: object
      properties:
        secret:
          type: string
        otpauth_uri:
          type: string
      required:
      - otpauth_uri
      - secret
    MfaVerifyRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        mfa_token:
          type: string
          minLength: 1
          maxLength: 500
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
      - mfa_token
    Ping:
      type: object
      properties:
        status:
          type: string
        release:
          type: string
      required:
      - release
      - status
    QueueCounts:
      type: object
      properties:
        registrations_awaiting_approval:
          type: integer
        registrations_unverified:
          type: integer
      required:
      - registrations_awaiting_approval
      - registrations_unverified
    ReasonRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - reason
    RecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          items:
            type: string
      required:
      - recovery_codes
    RegisterRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        accepted_terms:
          type: boolean
        accepted_privacy:
          type: boolean
        accepted_conduct:
          type: boolean
        marketing_consent:
          type: boolean
          default: false
      required:
      - accepted_conduct
      - accepted_privacy
      - accepted_terms
      - email
      - password
    ResetPasswordRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - token
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - expires_at
      - id
      - last_used_at
      - user_agent
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    TokenRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - token
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
