        * `award` - award
        * `funding` - funding
        * `partnership` - partnership
    WinPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Win'
        next_cursor:
          type: string
          nullable: true
      required:
      - next_cursor
      - results
    WinReviewRequest:
      type: object
      description: |-
        Rejects fields the serializer does not declare.

        Silently ignoring unknown input hides client bugs and makes mass
        assignment mistakes easy to miss.
      properties:
        reason:
          type: string
          default: ''
          maxLength: 500
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    optionalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Optional: send it when signed in so events are tied to the member.'
