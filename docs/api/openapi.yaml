openapi: 3.0.3
info:
  title: WO Community API
  version: 1.0.0
  description: REST API for the WO Community platform.
paths:
  /api/v1/admin/blocked-domains:
    get:
      operationId: admin_blocked_domains_list
      summary: Sites that never get a preview card
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedDomain'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such post
    post:
      operationId: admin_blocked_domains_create
      description: The domain and every subdomain. Cards that already exist for it
        are taken down now and nothing more is fetched from it. Posts keep their plain
        link.
      summary: Block a site from preview cards
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockDomainRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedDomain'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such post
  /api/v1/admin/blocked-domains/{entry_id}:
    delete:
      operationId: admin_blocked_domains_destroy
      summary: Allow a site to have preview cards again
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: No such post
  /api/v1/admin/campaign-templates:
    get:
      operationId: admin_campaign_templates_list
      summary: Newsletter templates
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    post:
      operationId: admin_campaign_templates_create
      description: 'Blocks: heading, paragraph, button, image and divider. Merge field:
        `{{first_name}}`.'
      summary: Save a template
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/campaign-templates/{template_id}:
    delete:
      operationId: admin_campaign_templates_destroy
      summary: Delete a template
      parameters:
      - in: path
        name: template_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/campaigns:
    get:
      operationId: admin_campaigns_list
      summary: Newsletters
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
      - in: query
        name: status
        schema:
          enum:
          - draft
          - scheduled
          - sending
          - paused
          - sent
          - cancelled
          type: string
          default: ''
          minLength: 1
        description: |-
          * `draft` - draft
          * `scheduled` - scheduled
          * `sending` - sending
          * `paused` - paused
          * `sent` - sent
          * `cancelled` - cancelled
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    post:
      operationId: admin_campaigns_create
      description: Starts as a draft. Content is a list of blocks (or `template_id`).
        The audience is a saved segment (`segment_id`).
      summary: Write a newsletter
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/campaigns/{campaign_id}:
    get:
      operationId: admin_campaigns_retrieve
      summary: One newsletter
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
    patch:
      operationId: admin_campaigns_partial_update
      summary: Edit a draft or scheduled newsletter
      parameters:
      - in: header
        name: If-Match
        schema:
          type: string
        required: true
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Already sending or sent
        '412':
          description: Changed since the ETag was issued
        '428':
          description: If-Match header missing
    delete:
      operationId: admin_campaigns_destroy
      summary: Delete a draft
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
  /api/v1/admin/campaigns/{campaign_id}/cancel:
    post:
      operationId: admin_campaigns_cancel_create
      description: 'Actions: `send` (now), `schedule` (needs `scheduled_at`), `unschedule`,
        `pause` (the kill switch), `resume`, `cancel` and `test` (sends to you alone,
        204). Send, schedule and resume need a fresh MFA step-up. Sending freezes
        the audience, leaves out anyone who has unsubscribed, and rechecks each person
        just before their message goes.'
      summary: Run an action on a newsletter
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignScheduleRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '204':
          description: No response body
        '401':
          description: Not authenticated
        '403':
          description: Not allowed, or MFA missing
        '404':
          description: Not found
        '409':
          description: Not in a state that allows this
